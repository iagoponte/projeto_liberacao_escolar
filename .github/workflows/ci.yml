name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend | Ruff + Pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: liberacao
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: liberacao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U liberacao -d liberacao_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://liberacao:ci-only-password@localhost:5432/liberacao_test
      TEST_DATABASE_URL: postgresql+psycopg://liberacao:ci-only-password@localhost:5432/liberacao_test
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789abcdef
      SCHOOL_TIMEZONE: America/Sao_Paulo
      COOKIE_SECURE: "false"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Ajustar se backend/pyproject.toml exigir outra versão
      - uses: astral-sh/setup-uv@v5
      - name: Instalar dependências travadas
        run: uv sync --locked
      - name: Análise estática
        run: uv run ruff check .
      - name: Testes de backend
        run: uv run pytest -q

  frontend:
    name: Frontend | Lint + TypeScript + Vitest + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências travadas
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Checagem TypeScript
        run: npx tsc --noEmit
      - name: Testes de frontend
        run: npx vitest run
      - name: Build de produção
        run: npm run build
